name: Build PassPilot APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Android-Projekt entpacken
        run: unzip -o PassPilot-Android-Source-1.0.zip

      - name: Java einrichten
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: AndroidX aktivieren
        run: echo "android.useAndroidX=true" > PassPilot-Android-App/gradle.properties

      - name: PassPilot APK bauen
        working-directory: PassPilot-Android-App
        run: gradle :app:assembleDebug

      - name: APK umbenennen
        run: cp PassPilot-Android-App/app/build/outputs/apk/debug/app-debug.apk PassPilot-1.0-Test.apk

      - name: APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: PassPilot-Android-APK
          path: PassPilot-1.0-Test.apk
